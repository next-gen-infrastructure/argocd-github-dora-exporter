{{- if and .Values.githubApp.privateKey (not .Values.githubApp.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argocd-github-dora-exporter.fullname" . }}
  labels:
    {{- include "argocd-github-dora-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_APP_PRIVATE_KEY: {{ .Values.githubApp.privateKey | quote }}
{{- end }}
