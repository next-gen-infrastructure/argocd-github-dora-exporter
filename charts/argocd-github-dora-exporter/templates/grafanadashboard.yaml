{{- if .Values.grafanaDashboard.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "argocd-github-dora-exporter.fullname" . }}
  labels:
    {{- include "argocd-github-dora-exporter.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  instanceSelector:
    {{- toYaml (required "grafanaDashboard.instanceSelector is required when the dashboard is enabled" .Values.grafanaDashboard.instanceSelector) | nindent 4 }}
  resyncPeriod: {{ .Values.grafanaDashboard.resyncPeriod }}
  allowCrossNamespaceImport: {{ .Values.grafanaDashboard.allowCrossNamespaceImport }}
  {{- with .Values.grafanaDashboard.folderUID }}
  folderUID: {{ . | quote }}
  {{- end }}
  # Files.Get returns the file as is, so the {{ "{{app}}" }}-style legends in the JSON are not templated.
  json: |
    {{- .Files.Get "dashboards/dora.json" | nindent 4 }}
{{- end }}
