name: Package and publish Helm chart

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - run: helm lint charts/argocd-github-dora-exporter --set githubApp.id=1 --set githubApp.installationId=1 --set environment=ci --set config.defaultBranch=main

      - run: helm package charts/argocd-github-dora-exporter

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - run: helm push argocd-github-dora-exporter-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
